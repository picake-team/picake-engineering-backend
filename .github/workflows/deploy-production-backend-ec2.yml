name: Deploy Picake Backend to EC2 (Production)

permissions:
  contents: read

on:
  push:
    tags:
      - "backend/production-*"

jobs:
  # 의존성 설치·빌드는 서버가 아니라 여기서 한다. 서버(t4g.small, 메모리 2GB)에서 빌드하면 돌고 있는 앱·DB와
  # 메모리를 나눠 써서 멈출 수 있다(2026-11-04 production 26분 중단). 서버와 같은 Amazon Linux 2023 ARM
  # 컨테이너에서 빌드해 Prisma 엔진·bcrypt도 서버에 맞는 것이 들어간다. 공개 레포라 ARM 러너는 무료다.
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build release in Amazon Linux 2023 (same as EC2)
        run: |
          docker run --rm -v "$PWD":/w -w /w public.ecr.aws/amazonlinux/amazonlinux:2023 \
            bash .github/scripts/build-backend-release.sh

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: backend-release
          path: deploy.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  deploy-production:
    needs: build
    # 빌드가 실패해도 이 작업은 떠서 디스코드에 실패를 알린다(서버는 건드리지 않음)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Stop if build failed
        if: needs.build.result != 'success'
        run: |
          echo "::error title=Build failed::빌드가 실패해 서버에는 아무것도 바꾸지 않았습니다."
          exit 1

      - name: Download release
        uses: actions/download-artifact@v4
        with:
          name: backend-release

      - name: Copy deployment package to EC2
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0 (서버 접속 키가 넘어가는 바깥 도구라 커밋으로 고정)
        with:
          host: ${{ secrets.PRODUCTION_EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.PRODUCTION_EC2_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "~/"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5 (커밋으로 고정)
        with:
          host: ${{ secrets.PRODUCTION_EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.PRODUCTION_EC2_SSH_KEY }}
          script: |
            set -e

            # 롤백 함수 정의
            # 새 버전을 켜기 전(SWITCHED=false)에 실패하면 기존 앱이 그대로 돌고 있으므로 폴더만 되돌린다.
            # 켠 뒤(SWITCHED=true)에 실패하면 이전 버전 폴더(node_modules·dist 포함)로 되돌려 다시 켠다.
            SWITCHED=false
            # 새 버전 폴더(~/picake.next)를 ~/picake로 바꿨는지. 바꾸기 전이면 돌고 있는 앱 폴더는 건드리지 않는다
            MOVED=false
            rollback_deployment() {
              echo ""
              echo "🔄 배포 실패로 인한 롤백 시작..."
              cd ~

              if [ "$MOVED" != true ]; then
                rm -rf ~/picake.next
                echo "✅ 롤백 완료 - 폴더를 바꾸기 전에 멈춰서 기존 앱은 그대로 돌고 있습니다"
                exit 1
              fi

              # 가장 최근 백업 = 이번 배포 직전까지 돌던 버전 (이름의 타임스탬프로 고른다)
              LATEST_BACKUP=$(ls -d ~/picake.backup.* 2>/dev/null | sort -r | head -1)
              if [ -z "$LATEST_BACKUP" ] || [ ! -d "$LATEST_BACKUP" ]; then
                echo "❌ 롤백 실패 - 백업을 찾을 수 없습니다"
                exit 1
              fi

              echo "📦 백업 복원 중: $LATEST_BACKUP"
              rm -rf ~/picake
              mv "$LATEST_BACKUP" ~/picake

              if [ "$SWITCHED" != true ]; then
                echo "✅ 롤백 완료 - 새 버전을 켜기 전에 멈춰서 기존 앱은 그대로 돌고 있습니다"
                exit 1
              fi

              # 새 버전을 켠 뒤 실패한 경우: 이전 버전으로 다시 켠다
              pm2 delete picake-backend-production 2>/dev/null || true
              if [ -f ~/picake/apps/backend/dist/main.js ] && [ -d ~/picake/node_modules ]; then
                cd ~/picake/apps/backend
                NODE_ENV=production pm2 start dist/main.js \
                  --name picake-backend-production \
                  --update-env \
                  --cwd $(pwd) || true
                pm2 save || true
                for i in $(seq 1 30); do
                  if curl -sf http://localhost:8080/health >/dev/null 2>&1; then
                    echo "✅ 롤백 완료 - 이전 버전으로 복구되었습니다 (${i}회째 확인)"
                    exit 1
                  fi
                  sleep 2
                done
                echo "❌ 이전 버전도 /health에 응답하지 않습니다 — pm2 logs picake-backend-production --lines 50 확인"
              else
                echo "⚠️ 롤백 실패 - 백업에 빌드 결과나 의존성(node_modules)이 없습니다"
              fi

              exit 1
            }

            # 백업 파일 개수 제한 함수 (디스크 사용량에 따라 동적 조정)
            cleanup_old_backups() {
              local BACKUP_TYPE=$1
              local BACKUP_PATTERN=$2
              local USE_PERCENT=$3
              local KEEP_COUNT=5

              # 디스크 사용량에 따라 백업 개수 조정
              if [ "$USE_PERCENT" -ge 90 ]; then
                KEEP_COUNT=2
                echo "⚠️ 디스크 사용량이 높아 백업을 최근 ${KEEP_COUNT}개만 유지합니다"
              elif [ "$USE_PERCENT" -ge 85 ]; then
                KEEP_COUNT=3
                echo "⚠️ 디스크 사용량이 높아 백업을 최근 ${KEEP_COUNT}개만 유지합니다"
              fi

              echo "🧹 오래된 ${BACKUP_TYPE} 백업 정리 중 (최근 ${KEEP_COUNT}개만 유지)..."

              # 이름의 타임스탬프(YYYYMMDD_HHMMSS) 기준으로 정렬하여 오래된 것부터 삭제
              # (수정 시각 -t로 정렬하면 오래된 백업의 node_modules를 지운 순간 그 백업이 "최근"이 되어 엉뚱한 것을 지운다)
              # -d: 백업 폴더 자체를 나열한다 (없으면 폴더 안 파일 이름이 나와 엉뚱한 것을 지운다)
              ls -d ${BACKUP_PATTERN} 2>/dev/null | sort -r | tail -n +$((KEEP_COUNT + 1)) | while read -r old_backup; do
                case "$old_backup" in
                  "$HOME"/picake.backup.*|"$HOME"/db-backup.*) ;;
                  *) echo "  건너뜀(백업 경로 아님): $old_backup"; continue ;;
                esac
                echo "  삭제: $old_backup"
                rm -rf "$old_backup"
              done || true
            }

            # 롤백에 쓰는 가장 최근 백업만 node_modules를 남기고, 그보다 오래된 백업의 node_modules는 지운다(디스크 절약)
            strip_old_backup_deps() {
              ls -d "$HOME"/picake.backup.* 2>/dev/null | sort -r | tail -n +2 | while read -r old_backup; do
                case "$old_backup" in
                  "$HOME"/picake.backup.*) find "$old_backup" -type d -name node_modules -prune -exec rm -rf {} + 2>/dev/null || true ;;
                esac
              done || true
            }

            echo "📊 디스크 사용량 체크"
            USE_PERCENT=$(df / | tail -1 | awk '{print $5}' | sed 's/%//')
            echo "현재 디스크 사용량: ${USE_PERCENT}%"

            # 오래된 백업 파일 정리 (항상 실행, 디스크 사용량에 따라 유지 개수만 조정)
            echo "🗑️ 오래된 백업 파일 정리 중..."
            cleanup_old_backups "서버" "$HOME/picake.backup.*" "$USE_PERCENT"
            cleanup_old_backups "DB" "$HOME/db-backup.*.sql.gz" "$USE_PERCENT"
            cleanup_old_backups "DB" "$HOME/db-backup.*.dump" "$USE_PERCENT"

            # 디스크 사용량이 80% 이상이면 추가 정리 작업 수행
            if [ "$USE_PERCENT" -gt 80 ]; then
              echo "⚠️ 디스크 사용량이 ${USE_PERCENT}%로 높습니다. 추가 정리 작업을 시작합니다..."
              if [ "$USE_PERCENT" -ge 85 ]; then
                echo "📢 주의: 디스크 사용량이 지속적으로 높다면 EC2 루트 볼륨 확장 또는 배포 로직 개선을 고려하세요"
              fi

              # 지금 돌고 있는 앱(~/picake)과 가장 최근 백업의 node_modules는 지우지 않는다(롤백 때 그대로 다시 켜야 함)
              echo "🗑️ 오래된 백업의 node_modules 삭제 중..."
              strip_old_backup_deps

              # Yarn 캐시 정리
              echo "🗑️ Yarn 캐시 정리 중..."
              yarn cache clean --all 2>/dev/null || true
              rm -rf ~/.cache ~/.yarn/cache ~/.yarn/berry/cache

              # PM2 로그 정리
              echo "🗑️ PM2 로그 정리 중..."
              pm2 flush || true

              # 시스템 패키지 캐시 정리
              echo "🗑️ 시스템 패키지 캐시 정리 중..."
              sudo dnf clean all 2>/dev/null || true

              # 임시 파일 정리
              echo "🗑️ 임시 파일 정리 중..."
              sudo rm -rf /tmp/* 2>/dev/null || true
              rm -rf ~/tmp/* 2>/dev/null || true

              # 정리 후 디스크 사용량 재확인
              USE_PERCENT=$(df / | tail -1 | awk '{print $5}' | sed 's/%//')
              echo "정리 후 디스크 사용량: ${USE_PERCENT}%"

              # 여전히 95% 이상이면 배포 중단
              if [ "$USE_PERCENT" -gt 95 ]; then
                echo "❌ 디스크 사용량 ${USE_PERCENT}% — 정리 후에도 공간 부족. 배포 중단"
                exit 1
              fi
            fi

            # 🗄️ DB 백업 생성 (배포 전)
            echo "🗄️ 데이터베이스 백업 생성 중..."
            DB_BACKUP_NAME=~/db-backup.$(date +%Y%m%d_%H%M%S).sql.gz
            PGPASSWORD='${{ secrets.PRODUCTION_DATABASE_PASSWORD }}' \
              pg_dump -h localhost -p 5432 -U picake_admin \
              -d picake_production_db \
              -F c -f "${DB_BACKUP_NAME%.gz}" 2>/dev/null || {
              echo "⚠️ DB 백업 실패 (계속 진행합니다)"
              rm -f "${DB_BACKUP_NAME%.gz}"
            }

            # 압축 (백업이 성공한 경우만)
            if [ -f "${DB_BACKUP_NAME%.gz}" ]; then
              gzip "${DB_BACKUP_NAME%.gz}"
              echo "✅ DB 백업 완료: $DB_BACKUP_NAME"
            fi

            # 새 버전은 ~/picake.next에 다 풀고 환경 파일·마이그레이션까지 끝낸 뒤, 켜기 바로 전에 폴더를 바꾼다.
            # 전에는 돌고 있는 앱 폴더를 먼저 옮기고 그 자리에 풀어서, 그사이 앱이 다시 켜지면 반쯤 풀린 폴더에서
            # "Cannot find module '@nestjs/core'"로 거듭 멈췄다(상용 오류 로그, 2026-11-12).
            # 배포 실패 시 롤백을 위한 trap 설정
            trap rollback_deployment ERR

            rm -rf ~/picake.next
            mkdir -p ~/picake.next
            cd ~/picake.next

            echo "📂 압축 해제"
            tar -xzf ~/deploy.tar.gz
            rm ~/deploy.tar.gz

            # 의존성(node_modules)과 빌드 결과(dist)는 build 작업에서 서버와 같은 환경으로 만들어 왔다 → 서버에서 설치·빌드하지 않는다
            if [ ! -f apps/backend/dist/main.js ] || [ ! -d node_modules ]; then
              echo "❌ 배포 묶음에 빌드 결과나 의존성이 없습니다"
              rollback_deployment
            fi

            echo "⚙️ 환경 변수 파일 생성 중..."
            cat > apps/backend/.env.production << EOF
            # Environment
            NODE_ENV=production

            # PORT - production
            PORT=8080

            # DOMAIN - production
            PUBLIC_USER_DOMAIN=https://picakes.com
            PUBLIC_SELLER_DOMAIN=https://seller.picakes.com
            PUBLIC_ADMIN_DOMAIN=https://admin.picakes.com

            # CORS Configuration - production
            CORS_ORIGIN=https://picakes.com,https://seller.picakes.com,https://admin.picakes.com

            # JWT - production
            JWT_SECRET=${{ secrets.PRODUCTION_JWT_SECRET }}

            # DATABASE - production
            # 옵션 1: EC2 PostgreSQL 사용 (비용 절감)
            DATABASE_URL=postgresql://picake_admin:${{ secrets.PRODUCTION_DATABASE_PASSWORD }}@localhost:5432/picake_production_db?schema=public

            # SWAGGER - development & staging
            SWAGGER_USERNAME=${{ secrets.SWAGGER_USERNAME }}
            SWAGGER_PASSWORD=${{ secrets.SWAGGER_PASSWORD }}

            # GOOGLE OAuth (Consumer) - production
            GOOGLE_CLIENT_ID=${{ secrets.PRODUCTION_GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.PRODUCTION_GOOGLE_CLIENT_SECRET }}
            # GOOGLE OAuth (Seller) - production
            GOOGLE_CLIENT_ID_SELLER=${{ secrets.PRODUCTION_GOOGLE_CLIENT_ID_SELLER }}
            GOOGLE_CLIENT_SECRET_SELLER=${{ secrets.PRODUCTION_GOOGLE_CLIENT_SECRET_SELLER }}

            # KAKAO (Consumer) - development & staging & production (공용)
            KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
            KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}
            # KAKAO (Seller) - development & staging & production (공용)
            KAKAO_CLIENT_ID_SELLER=${{ secrets.KAKAO_CLIENT_ID_SELLER }}
            KAKAO_CLIENT_SECRET_SELLER=${{ secrets.KAKAO_CLIENT_SECRET_SELLER }}

            # APPLE OAuth (Consumer, web-user 전용) - development & staging & production (공용)
            APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}
            APPLE_KEY_ID=${{ secrets.APPLE_KEY_ID }}
            APPLE_CLIENT_ID=${{ secrets.APPLE_CLIENT_ID }}
            APPLE_PRIVATE_KEY=${{ secrets.APPLE_PRIVATE_KEY }}
            APPLE_REFRESH_TOKEN_ENCRYPTION_KEY=${{ secrets.APPLE_REFRESH_TOKEN_ENCRYPTION_KEY }}

            # 판매자 앱 심사용 로그인 코드의 SHA-256 (I-48). 비밀값이 없으면 빈 값 → 심사용 로그인 꺼짐
            SELLER_REVIEW_LOGIN_CODE_SHA256=${{ secrets.SELLER_REVIEW_LOGIN_CODE_SHA256 }}

            # FIREBASE Admin SDK - development & staging & production (공용)
            FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
            FIREBASE_PRIVATE_KEY=${{ secrets.FIREBASE_PRIVATE_KEY }}
            FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}

            # AWS - development & staging & production (공용)
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_REGION=ap-northeast-2
            # AWS S3 Bucket - production
            S3_BUCKET=${{ secrets.PRODUCTION_S3_BUCKET }}
            CLOUDFRONT_DOMAIN=${{ secrets.PRODUCTION_CLOUDFRONT_DOMAIN }}

            # DATA_GO_KR_API_KEY - development & staging & production (공용)
            DATA_GO_KR_API_KEY=${{ secrets.DATA_GO_KR_API_KEY }}

            # Sentry - production
            SENTRY_DSN=${{ secrets.PRODUCTION_SENTRY_DSN }}
            # 이 배포의 태그(Sentry release로 씀, 코드에서 /를 -로 바꿈)
            SENTRY_RELEASE=${{ github.ref_name }}

            # SOLAPI (SMS 인증 · 카카오 알림톡) - staging & production (공용)
            SOLAPI_API_KEY=${{ secrets.SOLAPI_API_KEY }}
            SOLAPI_API_SECRET=${{ secrets.SOLAPI_API_SECRET }}
            SOLAPI_SENDER_PHONE=${{ secrets.SOLAPI_SENDER_PHONE }}
            SOLAPI_PFID=${{ secrets.SOLAPI_PFID }}

            # Claude API (상품 상세설명 AI 초안) - staging & production (공용). 없으면 AI 초안만 꺼진다
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}

            # 디스코드 【PICAKE】운영 웹후크(견적 요청 새 요청 알림, I-46). 없으면 알림만 꺼진다. staging은 개발 채널로 보낸다
            DISCORD_WEBHOOK_URL_OPS=${{ secrets.DISCORD_WEBHOOK_URL_OPS }}

            # SERVICE MAINTENANCE MODE (GitHub Secret: PRODUCTION_SERVICE_MAINTENANCE_MODE)
            # true 로 설정하면 모든 API·WebSocket 요청을 차단합니다. 미설정 시 false.
            SERVICE_MAINTENANCE_MODE=${{ secrets.PRODUCTION_SERVICE_MAINTENANCE_MODE }}
            EOF

            # 환경 변수 파일 권한 설정
            chmod 600 apps/backend/.env.production

            echo "🗄️ Prisma migrate"
            cd apps/backend
            # DATABASE_URL을 안전하게 읽어서 export (주석 제외, 첫 번째 매칭만)
            DATABASE_URL=$(grep '^DATABASE_URL=' .env.production | head -1 | cut -d '=' -f2- | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            export DATABASE_URL
            echo "DATABASE_URL 설정 완료"

            # 실패한 마이그레이션 사전 확인 및 해결
            echo "🔍 마이그레이션 상태 확인 중..."
            MIGRATE_STATUS=$(npx prisma migrate status --schema ./src/infra/database/prisma/schema.prisma 2>&1 || true)

            if echo "$MIGRATE_STATUS" | grep -q "failed\|P3009"; then
              echo "⚠️ 실패한 마이그레이션 감지. 롤백 상태로 표시 중..."
              FAILED_MIGRATION=$(echo "$MIGRATE_STATUS" | grep -oP '^\s*\K[0-9_]+' | head -1 || echo "20260204214916_202602050649")

              if [ -n "$FAILED_MIGRATION" ]; then
                echo "🔧 마이그레이션 '$FAILED_MIGRATION'을 롤백 상태로 표시 중..."
                npx prisma migrate resolve --rolled-back "$FAILED_MIGRATION" --schema ./src/infra/database/prisma/schema.prisma 2>/dev/null || true
                echo "✅ 실패한 마이그레이션 해결 완료"
              fi
            fi

            # Prisma migrate 실행
            MIGRATE_SUCCESS=false
            # pipefail: `| tee`만 있으면 tee의 성공이 결과가 되어 마이그레이션 실패를 성공으로 보고 넘어간다
            if ! (set -o pipefail; npx prisma migrate deploy --schema ./src/infra/database/prisma/schema.prisma 2>&1 | tee /tmp/migrate_output.log); then
              MIGRATE_OUTPUT=$(cat /tmp/migrate_output.log)

              # P3009 오류: 실패한 마이그레이션이 있는 경우
              if echo "$MIGRATE_OUTPUT" | grep -q "P3009\|failed migrations"; then
                echo "⚠️ 실패한 마이그레이션 감지. 롤백 상태로 표시 후 재시도..."

                FAILED_MIGRATION=$(echo "$MIGRATE_OUTPUT" | grep -oP 'The `\K[^`]+' | head -1 || echo "20260204214916_202602050649")

                if [ -n "$FAILED_MIGRATION" ]; then
                  echo "🔧 마이그레이션 '$FAILED_MIGRATION'을 롤백 상태로 표시 중..."
                  npx prisma migrate resolve --rolled-back "$FAILED_MIGRATION" --schema ./src/infra/database/prisma/schema.prisma 2>/dev/null || true

                  echo "🔄 마이그레이션 재시도 중..."
                  if npx prisma migrate deploy --schema ./src/infra/database/prisma/schema.prisma; then
                    echo "✅ Prisma migrate 성공 (재시도 후)"
                    MIGRATE_SUCCESS=true
                  else
                    echo "❌ Prisma migrate 재시도 실패"
                    rollback_deployment
                  fi
                else
                  echo "❌ 실패한 마이그레이션 이름을 찾을 수 없습니다"
                  rollback_deployment
                fi
              else
                echo "❌ Prisma migrate 실패"
                echo ""
                echo "⚠️ PostgreSQL 인증 설정이 필요할 수 있습니다."
                echo "📖 EC2 서버에 SSH 접속하여 pg_hba.conf(md5) 및 PostgreSQL 재시작을 확인하세요."
                echo ""
                rollback_deployment
              fi
            else
              echo "✅ Prisma migrate 성공"
              MIGRATE_SUCCESS=true
            fi

            # 마이그레이션 성공 뒤 (Prisma Client는 build 작업에서 만들어 dist에 들어 있어 서버에서 다시 만들지 않는다)
            if [ "$MIGRATE_SUCCESS" = true ]; then
              echo "✅ 마이그레이션 완료"
            fi

            cd ~

            echo "💾 스왑 메모리 확인 (앱이 잠깐 메모리를 많이 쓸 때 멈추지 않게)"
            ensure_swap() {
              if swapon --show 2>/dev/null | grep -q '/swapfile'; then echo "스왑 있음"; return 0; fi
              # fallocate로 만든 파일은 일부 파일 시스템에서 스왑으로 못 써서 dd로 만든다. 켜지 못하면 다시 만든다
              make_swapfile() {
                sudo rm -f /swapfile
                sudo dd if=/dev/zero of=/swapfile bs=1M count=2048 status=none && sudo chmod 600 /swapfile && sudo mkswap /swapfile >/dev/null
              }
              [ -f /swapfile ] || make_swapfile || return 1
              sudo swapon /swapfile 2>/dev/null || { make_swapfile && sudo swapon /swapfile; } || return 1
              grep -q '^/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab >/dev/null
              echo "스왑 2GB 켬"
            }
            ensure_swap || echo "⚠️ 스왑을 켜지 못했어요 (배포는 계속)"
            free -m | sed -n '1,3p' || true

            # 기존 프로젝트 백업 (타임스탬프 포함) → 새 버전으로 폴더 바꾸기. 두 번의 mv라 틈이 거의 없다
            # 롤백 때 그대로 다시 켤 수 있게 node_modules·dist를 지우지 않고 통째로 옮긴다(돌고 있는 앱은 그대로 계속 돈다).
            # 오래된 백업의 node_modules는 strip_old_backup_deps가 지운다.
            echo "🔁 폴더 바꾸기"
            if [ -d ~/picake ]; then
              find ~/picake -type f -name "*.log" -delete 2>/dev/null || true
              CURRENT_BACKUP_NAME=~/picake.backup.$(date +%Y%m%d_%H%M%S)
              mv ~/picake "$CURRENT_BACKUP_NAME"
              echo "📦 기존 프로젝트 백업: $CURRENT_BACKUP_NAME"
            fi
            MOVED=true
            mv ~/picake.next ~/picake
            strip_old_backup_deps
            cd ~/picake

            echo "🚀 PM2 restart"
            SWITCHED=true
            pm2 delete picake-backend-production || true
            cd apps/backend
            NODE_ENV=production pm2 start dist/main.js \
              --name picake-backend-production \
              --update-env \
              --cwd $(pwd) || {
              echo "❌ PM2 시작 실패"
              rollback_deployment
            }
            pm2 save

            echo "🏥 백엔드 헬스체크 (localhost, PM2 기동 대기 포함, 최대 90초)"
            HEALTH_OK=false
            for i in $(seq 1 45); do
              if curl -sf http://localhost:8080/health >/tmp/local-health.json 2>/dev/null; then
                echo "✅ localhost:8080 /health 정상 (${i}회째 시도)"
                cat /tmp/local-health.json
                echo ""
                HEALTH_OK=true
                break
              fi
              echo "  시도 ${i}/45: 아직 기동 중... 2초 후 재시도"
              sleep 2
            done
            if [ "$HEALTH_OK" != true ]; then
              echo "❌ 새 버전이 90초 안에 /health에 응답하지 않아 이전 버전으로 되돌립니다"
              pm2 logs picake-backend-production --lines 40 --nostream 2>/dev/null || true
              rollback_deployment
            fi

            # 배포 성공 시 trap 해제
            trap - ERR

            # 서버를 재부팅해도 앱이 다시 켜지게 (한 번만 설정, 실패해도 배포는 성공으로 둔다)
            if ! systemctl is-enabled pm2-ec2-user >/dev/null 2>&1; then
              sudo env PATH="$PATH:$(dirname "$(command -v node)")" "$(command -v pm2)" startup systemd -u ec2-user --hp /home/ec2-user >/dev/null 2>&1 \
                && echo "pm2 자동 시작 설정함" || echo "⚠️ pm2 자동 시작 설정 실패 (배포는 계속)"
            fi

            echo "✅ 배포 완료!"
            pm2 list

            # SSL 인증서 상태 로그 (EC2 로컬, 배포 성공 후)
            echo ""
            echo "🔒 SSL 인증서 상태 (EC2)"
            API_HOST="api.picakes.com"
            CERT_FILE="/etc/letsencrypt/live/${API_HOST}/fullchain.pem"
            if sudo test -f "$CERT_FILE"; then
              NOT_AFTER=$(sudo openssl x509 -in "$CERT_FILE" -noout -enddate 2>/dev/null | cut -d= -f2)
              EXPIRY_EPOCH=$(date -d "$NOT_AFTER" +%s 2>/dev/null || echo 0)
              NOW_EPOCH=$(date +%s)
              DAYS_LEFT=$(( (EXPIRY_EPOCH - NOW_EPOCH) / 86400 ))
              echo "  도메인: ${API_HOST}"
              echo "  인증서: ${CERT_FILE}"
              echo "  만료일: ${NOT_AFTER}"
              echo "  남은 일수: ${DAYS_LEFT}일"
              if [ "$DAYS_LEFT" -lt 0 ]; then
                echo "❌ SSL 인증서 만료됨 — 프론트 Network Error 원인 가능"
                echo "   조치: sudo certbot renew --nginx && sudo nginx -t && sudo systemctl reload nginx"
              elif [ "$DAYS_LEFT" -le 14 ]; then
                echo "⚠️ SSL 인증서 ${DAYS_LEFT}일 후 만료 예정 — 갱신 권장"
              else
                echo "✅ SSL 인증서 유효"
              fi
            else
              echo "⚠️ Let's Encrypt 인증서 없음: ${CERT_FILE}"
            fi
            if command -v certbot >/dev/null 2>&1; then
              echo ""
              echo "  [certbot certificates]"
              sudo certbot certificates 2>/dev/null | grep -E "Certificate Name|Domains|Expiry Date" || true
            fi

            # 배포 성공 후 오래된 백업 정리 (디스크 사용량에 따라 동적 조정)
            USE_PERCENT=$(df / | tail -1 | awk '{print $5}' | sed 's/%//')
            cleanup_old_backups "서버" "$HOME/picake.backup.*" "$USE_PERCENT"
            cleanup_old_backups "DB" "$HOME/db-backup.*.sql.gz" "$USE_PERCENT"
            cleanup_old_backups "DB" "$HOME/db-backup.*.dump" "$USE_PERCENT"
            strip_old_backup_deps
            # 서버에서 더 이상 yarn 설치를 하지 않으므로 예전 패키지 캐시를 비운다
            rm -rf ~/.yarn/berry/cache 2>/dev/null || true

      - name: Verify SSL certificate and HTTPS health
        if: success()
        run: |
          set -euo pipefail
          HOST="api.picakes.com"
          WARN_DAYS=14

          echo "🔒 SSL 인증서 검증 (외부): https://${HOST}"
          echo "=============================================="

          EXPIRY=$(echo | openssl s_client -connect "${HOST}:443" -servername "$HOST" 2>/dev/null \
            | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2 || true)

          if [ -z "$EXPIRY" ]; then
            echo "::error title=SSL check failed::${HOST} 인증서 정보를 가져올 수 없습니다."
            exit 1
          fi

          EXPIRY_EPOCH=$(date -d "$EXPIRY" +%s)
          NOW_EPOCH=$(date +%s)
          DAYS_LEFT=$(( (EXPIRY_EPOCH - NOW_EPOCH) / 86400 ))

          echo "  도메인: ${HOST}"
          echo "  만료일: ${EXPIRY}"
          echo "  남은 일수: ${DAYS_LEFT}일"

          if [ "$DAYS_LEFT" -lt 0 ]; then
            echo "::error title=SSL certificate expired::${HOST} SSL 인증서가 만료되었습니다 (${DAYS_LEFT}일 경과)."
            echo "  EC2 SSH 후: sudo certbot renew --nginx && sudo nginx -t && sudo systemctl reload nginx"
            exit 1
          elif [ "$DAYS_LEFT" -le "$WARN_DAYS" ]; then
            echo "::warning title=SSL certificate expiring soon::${HOST} SSL 인증서가 ${DAYS_LEFT}일 후 만료됩니다."
          else
            echo "✅ SSL 인증서 유효 (${DAYS_LEFT}일 남음)"
          fi

          echo ""
          echo "🏥 HTTPS /health 검증 (백엔드 기동 대기 포함, 최대 60초)"
          HEALTH_URL="https://${HOST}/health"
          HEALTH_OK=false
          LAST_CODE="000"
          for i in $(seq 1 30); do
            LAST_CODE=$(curl -sS -o /tmp/production-health.json -w "%{http_code}" \
              --connect-timeout 10 "$HEALTH_URL" 2>/dev/null || echo "000")
            if [ "$LAST_CODE" = "200" ]; then
              echo "✅ ${HEALTH_URL} → HTTP 200 (${i}회째 시도)"
              cat /tmp/production-health.json
              echo ""
              HEALTH_OK=true
              break
            fi
            echo "  시도 ${i}/30: HTTP ${LAST_CODE} — 2초 후 재시도 (PM2/NestJS 기동 중일 수 있음)"
            sleep 2
          done
          if [ "$HEALTH_OK" != true ]; then
            echo "::error title=HTTPS health check failed::${HEALTH_URL} → HTTP ${LAST_CODE} (60초 대기 후)"
            echo "  SSL 만료, Nginx, PM2 상태를 확인하세요."
            [ -f /tmp/production-health.json ] && cat /tmp/production-health.json || true
            exit 1
          fi

          echo "=============================================="
          echo "✅ SSL 및 HTTPS 헬스체크 통과"

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_WEB_BE }}
          TAG: ${{ github.ref_name }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "⚠️ DISCORD_WEBHOOK_URL_WEB_BE is not set — skipping notification"
            exit 0
          fi

          case "$JOB_STATUS" in
            success) STATUS_LABEL="✅ 배포 성공"; COLOR=5763719 ;;
            failure) STATUS_LABEL="❌ 배포 실패"; COLOR=15548997 ;;
            cancelled) STATUS_LABEL="⚠️ 배포 취소"; COLOR=9807270 ;;
            *) STATUS_LABEL="ℹ️ 배포 종료 ($JOB_STATUS)"; COLOR=3447003 ;;
          esac

          API_URL="https://api.picakes.com"
          HEALTH_URL="${API_URL}/health"

          # 이번 배포에 담긴 작업: 같은 환경의 이전 배포 태그부터 이번 태그까지의 커밋 제목(머지 커밋 제외).
          # 실패해도 알림과 배포 결과에는 영향이 없도록 따로 감싼다.
          export LC_ALL=C.UTF-8
          rm -f /tmp/deploy-changes.txt /tmp/deploy-compare.txt
          (
            set +e +o pipefail
            git fetch --quiet --tags --unshallow origin 2>/dev/null || git fetch --quiet --tags origin 2>/dev/null
            PREFIX="${TAG%-v*}"
            PREV_TAG=$(git tag --list "${PREFIX}-*" --sort=-v:refname | awk -v t="$TAG" 'f{print;exit} $0==t{f=1}')
            if [ -z "$PREV_TAG" ]; then
              echo "이전 배포 태그가 없어 비교하지 못했어요(첫 배포)" > /tmp/deploy-changes.txt
              exit 0
            fi
            echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}" > /tmp/deploy-compare.txt
            git log --no-merges --pretty='• %s' "${PREV_TAG}..${TAG}" -- apps/backend > /tmp/deploy-log.txt
            TOTAL=$(grep -c . /tmp/deploy-log.txt)
            if [ "$TOTAL" -eq 0 ]; then
              echo "백엔드 코드 변경 없음(같은 코드를 다시 배포)" > /tmp/deploy-changes.txt
            else
              sed -n '1,15p' /tmp/deploy-log.txt > /tmp/deploy-changes.txt
              [ "$TOTAL" -gt 15 ] && echo "…외 $((TOTAL - 15))개" >> /tmp/deploy-changes.txt
            fi
          ) || true
          CHANGES=$(cat /tmp/deploy-changes.txt 2>/dev/null || echo "변경 목록을 만들지 못했어요")
          CHANGES="${CHANGES:0:1500}"
          COMPARE_URL=$(cat /tmp/deploy-compare.txt 2>/dev/null || true)
          if [ "$JOB_STATUS" = "success" ]; then
            CHANGES_TITLE="이번 배포에 들어간 작업"
          else
            CHANGES_TITLE="이번 배포에 담긴 작업(반영되지 않았을 수 있음)"
          fi

          if [ "$JOB_STATUS" = "failure" ]; then
            PAYLOAD=$(jq -n \
              --arg title "$STATUS_LABEL — backend (production)" \
              --argjson color "$COLOR" \
              --arg tag "$TAG" \
              --arg api "$API_URL" \
              --arg health "$HEALTH_URL" \
              --arg run_url "$RUN_URL" \
              --arg changes_title "$CHANGES_TITLE" \
              --arg changes "$CHANGES" \
              --arg compare "$COMPARE_URL" \
              '{
                embeds: [{
                  title: $title,
                  color: $color,
                  description: ("**" + $changes_title + "**\n" + $changes),
                  fields: [
                    { name: "태그", value: ("`" + $tag + "`"), inline: false },
                    { name: "API", value: ("[" + $api + "](" + $api + ")"), inline: true },
                    { name: "헬스체크", value: ("[" + $health + "](" + $health + ")"), inline: true },
                    { name: "전체 변경", value: (if $compare != "" then "[이전 배포와 비교](" + $compare + ")" else "이전 배포 없음" end), inline: false },
                    { name: "GitHub Actions", value: ("[워크플로우 로그](" + $run_url + ")"), inline: false },
                    { name: "안내", value: "상세 로그는 GitHub Actions를 확인하세요. EC2 SSH 접속 후 `pm2 logs picake-backend-production --lines 50` 로 서버 로그를 볼 수 있습니다.", inline: false }
                  ],
                  timestamp: (now | strftime("%Y-%m-%dT%H:%M:%SZ"))
                }]
              }')
          else
            PAYLOAD=$(jq -n \
              --arg title "$STATUS_LABEL — backend (production)" \
              --argjson color "$COLOR" \
              --arg tag "$TAG" \
              --arg api "$API_URL" \
              --arg health "$HEALTH_URL" \
              --arg run_url "$RUN_URL" \
              --arg changes_title "$CHANGES_TITLE" \
              --arg changes "$CHANGES" \
              --arg compare "$COMPARE_URL" \
              '{
                embeds: [{
                  title: $title,
                  color: $color,
                  description: ("**" + $changes_title + "**\n" + $changes),
                  fields: [
                    { name: "태그", value: ("`" + $tag + "`"), inline: false },
                    { name: "API", value: ("[" + $api + "](" + $api + ")"), inline: true },
                    { name: "헬스체크", value: ("[" + $health + "](" + $health + ")"), inline: true },
                    { name: "전체 변경", value: (if $compare != "" then "[이전 배포와 비교](" + $compare + ")" else "이전 배포 없음" end), inline: false },
                    { name: "GitHub Actions", value: ("[워크플로우 로그](" + $run_url + ")"), inline: false }
                  ],
                  timestamp: (now | strftime("%Y-%m-%dT%H:%M:%SZ"))
                }]
              }')
          fi

          HTTP_STATUS=$(curl -s -o /tmp/discord_response.txt -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Discord notification sent (HTTP $HTTP_STATUS)"
          else
            echo "⚠️ Discord notification failed (HTTP $HTTP_STATUS) — deploy result is unchanged"
            cat /tmp/discord_response.txt
          fi
