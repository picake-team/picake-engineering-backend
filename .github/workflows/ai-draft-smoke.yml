name: AI Draft Smoke

# 상품 상세설명 AI 초안을 실제 Claude API로 점검한다 (예시 상품 3개, 실제 매장 데이터 아님).
# 규칙(네이버 전용 안내 제외, 근거 없으면 [판매자 확인 필요], 자료 안 지시 무시)을 지키는지와 토큰·예상 비용을 보여 준다.
# - Actions 화면에서 수동 실행 (main에 있을 때)
# - 또는 ai-smoke-* 태그를 푸시하면 그 커밋으로 실행 (기능 브랜치에서 점검할 때)
# 키는 ANTHROPIC_API_KEY 시크릿에서만 읽고 출력하지 않는다. 한 번 돌리는 비용은 Haiku 기준 1원 안팎.
on:
  workflow_dispatch:
    inputs:
      models:
        description: "점검할 모델 (쉼표로 구분)"
        required: false
        default: "claude-haiku-5-5"
  push:
    tags:
      - "ai-smoke-*"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Get Yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run AI draft smoke
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 태그로 실행하면 Haiku와 Sonnet을 비교한다
          AI_SMOKE_MODELS: ${{ github.event.inputs.models || 'claude-haiku-5-5,claude-sonnet-5-5' }}
        run: yarn workspace @picake/backend ai:draft-smoke
