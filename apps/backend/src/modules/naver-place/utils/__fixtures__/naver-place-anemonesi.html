   "description": "Anemonesi Cake는 2019년 설립된 Premium Cake & Dessert Boutique 입니다. Le Cordon Bleu에서 수학한 오너 파티쉐가 매일 아침 정성을 다해 케이크와 디저트를 만듭니다.\n\n홀케이크, 2단/3단 주문제작 케이크 전문으로 인스타그램 팔로어 4.1만명의 선택을 받은 케이크샵 입니다.\n\n매장은 Cafe ANMNS로 운영하고 있습니다. 딸기 조각 쇼트케이크, 딸기 파이, 파르페, 두쫀쿠, 카라멜 무화과 스콘, 메이플 버터플라이 쿠키 등 시즌별로 다채로운 디저트를 경험하실 수 있습니다. 맛있는 커피와 밀크티, 백차와 말차라떼도 준비되어 있습니다.\n\n케이크 예약은 픽업 전날까지 네이버 예약으로 간편하게 가능하며 당일 케이크 주문은 매장으로 전화 부탁드립니다.\n\n아네모네시의 시그니처 케이크는 2019년 탄생한 The Original Jellybalm Cake로서 출시 직후부터 지금까지 많은 사랑을 받고 있습니다. 빛의 변화에 따라 오묘하게 반짝이는 Jellybalm Cake는 받으시는 분에게 잊지 못할 하루를 선물합니다.\n\nIU, BTS, Jennie 등 수많은 셀럽들에게 선물된 특별한 아름다움의 케이크로 브라이덜샤워와 웨딩케이크로도 많은 사랑을 받고 있습니다.\n\n아네모네시 케이크로 기억에 남는 특별한 추억을 선물해보는 것은 어떨까요?\n\n그것들은 마치 오래된 노래처럼,\n기억 저편의 따스함을 불러오는 조각들입니다.\n\n저는 정성껏 케이크와 디저트를 준비하겠습니다.\n\n감사합니다.\n아네모네시 올림.\n\n* Anemonesi Cake\n* est. 2019\n* Instagram Followers 41K\n* Le Cordon Bleu - Diplome De Patisserie\n* Ecole Bellouet Counseil Intensive Course\n\n** 픽업 전날 밤 12시까지 네이버 예약으로\n편리하게 주문하실 수 있습니다.\n** 2단, 3단 케이크, 커스텀디자인 케이크는 인스타그램DM 부탁드립니다. 친절한 상담으로 원하시는 케이크를 제작해드립니다.\n** 매일 소량의 당일 케이크를 만들고 있습니다.\n당일 케이크 문의는 매장으로 전화 부탁드립니다.\n\n*** 케이크 판에 알파벳 15자 내외의 레터링이 가능합니다. 네이버 예약 요청사항에 적어주시면 추가 비용 없이 작업해드립니다.\n\n*** 직접 자동차 퀵을 부르시면, 케이크를 배송 받으실 수 있습니다.\n오토바이 퀵은 케이크가 파손되기 때문에 꼭!! 자동차 퀵으로 직접 접수해주세요. 네이버 예약 요청사항에 퀵으로 수령한다는 내용을 적어주시면 감사하겠습니다.\n\n**** 아네모네시 케이크는 부드럽고 촉촉한 제누와즈 시트 사이로 상큼달콤한 요거트 생크림과 다채로운 생과일이 듬뿍 들어있습니다.\n\n많은 분들이 예쁜 디자인 때문에 아네모네시를 첫구매하시고 재구매는 맛있어서 하시는 경우가 많습니다. 남녀노소 호불호 없이 즐기실 수 있는 디저트 케이크 입니다.\n\n***** 구움과자 선물세트, 디저트 케이터링을 원하시는 분들은 인스타그램DM 또는 매장으로 전화 부탁드립니다. 친절하게 상담 후 준비해드리겠습니다.\n\n***** 아네모네시 케이크는 협찬 광고를 진행하지 않습니다. 모든 리뷰는 고객님들의 내돈내산 리뷰입니다.\n\n소중한 분들과 행복한 추억을 만드실 수 있도록\n정성을 다하겠습니다.\n\n(Copyright)\n2026 Anemonesi. All rights reserved."
